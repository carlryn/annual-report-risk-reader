85:
  - title: Carbon taxes and tariffs
    category: climate
    secondary: regulatory
    section: E1 Climate Change - Impacts, risks, and opportunities
    description: >-
      Our business outlook is influenced by political and legal developments. Political and market transition risks,
      such as carbon taxes, can financially impact Vestas. High carbon taxes and tariffs will increase the cost of
      GHG-intensive mate- rials like steel, raising the overall cost of wind turbines. If we cannot distribute these
      costs along our value chain or transi- tion to low-carbon alternatives fast enough, our cost base may be
      impacted.
    mitigation: None

118:
  - title: Cyber security incidents
    category: cyber
    section: G1 Entity-specific Cyber security - Impacts, risks, and opportunities
    description: >-
      A cyber security incident could disrupt Vestas’ ability to control power plants, directly impacting customers
      and, ultimately, society through power outages or higher electricity prices. The primary threat comes from
      politically or financially motivated actors seeking to trigger outages, and geopolitical tensions amplify the
      risk as Vestas is a potential target for those seeking to impact customers and power producers.
    mitigation: >-
      Vestas’ enterprise-wide Cyber Risk Management Strategy, launched in 2024, systematically identifies, assesses,
      and mitigates cyber risks. The Cyber Security Services Framework helps customers quantify and manage the impact
      of cyber incidents, and a customer-focused Security Operations Centre monitors serviced power plants to detect
      and respond to incidents. All Vestas technologies are built to the ISA/IEC 62443 cyber security standard.

  - title: Cyber security risks
    category: cyber
    secondary: operational
    section: G1 Entity-specific Cyber security - Impacts, risks, and opportunities
    description: >-
      Our digitally connected and geographically dispersed wind turbines are essential to deliver sustainable energy
      but also represent potential targets for cyber-attacks. Such incidents could disrupt energy production and cause
      outages. For Vestas, a successful cyber-attack could interrupt operations, erode partner trust, and cause
      significant financial losses.
    mitigation: >-
      Vestas has increased investment in cyber security across R&D, service, and digital infrastructure over the past
      three years and manages cyber risks through its enterprise-wide Cyber Risk Management Strategy. An internal
      Security Operations Centre provides real-time detection and response across Vestas’ global digital
      infrastructure, and the Cyber Academy trains every employee to reduce attack surfaces and respond to threats.
