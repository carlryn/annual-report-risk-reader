50: []

51:
  - title: Geopolitical conflict and trade barriers
    category: supply chain
    section: Main risks
    description: >-
      Conflicts in Ukraine and the Middle East and intensifying trade tensions, with tariffs, sanctions, and export
      controls on e.g. critical materials, are disrupting global supply chains and business operations. This can delay
      deliveries and raise Vestas’ costs through tariffs and trade barriers, challenging cost efficiency.
    mitigation: >-
      We manage geopolitical risks by continuously monitoring global developments and implementing appropriate
      mitigations. By maintaining a global and regionalised manufacturing footprint, Vestas can effectively respond to
      geopolitical shifts and regulatory changes. Additionally, we exercise commercial discipline and utilise
      indexation and financial hedging strategies to minimise exposure.

  - title: Shifting industrial policy and regulation
    category: regulatory
    secondary: market
    section: Main risks
    description: >-
      Governments in the EU, China, and the USA are introducing assertive industrial policies aimed at securing
      domestic manufacturing and energy independence, reshaping the regulatory landscape. Changing market incentives
      and intensified clean-tech competition may weaken project economics, reduce market volumes, and challenge
      Vestas’ competitiveness.
    mitigation: Proactive advocacy ensures alignment and compliance with evolving policies and the regulatory climate.

  - title: Project execution
    category: operational
    section: Main risks
    description: >-
      Project execution at Vestas involves delivering complex onshore and offshore projects within specified
      parameters relating to quality, cost, and timeline. As the scale and complexity of offshore projects grow, so
      does the need for precise internal coordination. Execution is affected by delays in production capacity ramp-up,
      quality control issues during scaling, and supply chain disruptions. The lack of industry-wide standardisation
      and insufficient logistical infrastructure further complicate timely delivery. Success also depends on external
      factors, such as supportive regulatory frameworks, the cross-border mobility of skilled workers, and the
      availability of a sustainable and scalable supply chain, all of which remain vulnerable to geopolitical and
      market shifts. Challenges in project execution can lead to delays in delivery, cost overruns, and margin
      erosion, particularly as offshore projects grow in scale and complexity. Quality issues may result in formal
      disputes and reputational damage. These factors can undermine Vestas’ ability to secure new business, reduce
      investor confidence, and weaken long-term competitiveness in the global wind market
    mitigation: >-
      We mitigate execution risks through project governance, enhanced planning functions, and continuous alignment
      between commercial and delivery teams. We invest in scalable manufacturing capacity and maintain close
      coordination with suppliers to secure timely component availability.

  - title: Cyber attacks
    category: cyber
    section: Main risks
    description: >-
      Vestas’ digital and other critical assets are exposed to cyber attacks. A cyber attack may have dual
      implications for both Vestas as a company and for the societies that our energy solutions serve. Electricity
      producers rely on Vestas’ energy solutions for reliable and secure sustainable energy production, making these
      solutions critical infrastructure for societies around the world. Cyber-threat actors constantly evolve their
      methods and techniques to attack Vestas’ energy solutions, for the purpose of extorsion or to destabilise energy
      generation. Vestas’ technology, data, and operations are a potential target for geopolitical actors and the
      cyber-criminal industry. Politically motivated cyber actors may seek to disrupt energy production. A cyber
      attack on Vestas may be designed to impact our customers’ operations, causing electricity outage and physical
      damage to assets. A successful cyber attack on Vestas’ energy solutions and our infrastructures might result in
      significant economic loss and reputational damage.
    mitigation: >-
      As a global manufacturer and key contributor to critical infrastructure, Vestas is required to continuously
      address evolving cyber risks, both to our company and to the customers we serve. We are developing cyber
      security services aimed at helping our customers navigate cyber risks effectively, fulfil industry requirements
      and standards, and uphold their responsibilities. During 2025, our cyber security efforts were effective and no
      critical cyber security incidents took place

