# Golden set, step 2: each unique risk once, merged across pages and summarised.
# `locations` lists every place the risk is mentioned, most informative mention first.

- title: Geopolitical conflict and trade barriers
  category: supply chain
  locations:
    - { page: 51, section: "Main risks" }
  description: >-
    Conflicts in Ukraine and the Middle East and intensifying trade tensions, with tariffs, sanctions, and export
    controls on e.g. critical materials, are disrupting global supply chains and business operations. This can delay
    deliveries and raise Vestas’ costs through tariffs and trade barriers, challenging cost efficiency.
  mitigation: >-
    We manage geopolitical risks by continuously monitoring global developments and implementing appropriate
    mitigations. By maintaining a global and regionalised manufacturing footprint, Vestas can effectively respond to
    geopolitical shifts and regulatory changes. Additionally, we exercise commercial discipline and utilise indexation
    and financial hedging strategies to minimise exposure.

- title: Shifting industrial policy and regulation
  category: regulatory
  secondary: market
  locations:
    - { page: 51, section: "Main risks" }
  description: >-
    Governments in the EU, China, and the USA are introducing assertive industrial policies aimed at securing domestic
    manufacturing and energy independence, reshaping the regulatory landscape. Changing market incentives and
    intensified clean-tech competition may weaken project economics, reduce market volumes, and challenge Vestas’
    competitiveness.
  mitigation: Proactive advocacy ensures alignment and compliance with evolving policies and the regulatory climate.

- title: Project execution
  category: operational
  locations:
    - { page: 51, section: "Main risks" }
  description: >-
    Delivering increasingly large and complex onshore and offshore projects on quality, cost, and timeline is
    challenged by production ramp-up delays, quality issues, supply chain disruptions, and dependence on external
    factors such as regulation and skilled-worker mobility. Execution problems can cause delivery delays, cost
    overruns, margin erosion, disputes, and reputational damage that weaken Vestas’ competitiveness.
  mitigation: >-
    We mitigate execution risks through project governance, enhanced planning functions, and continuous alignment
    between commercial and delivery teams. We invest in scalable manufacturing capacity and maintain close
    coordination with suppliers to secure timely component availability.

- title: Cyber security risks
  category: cyber
  secondary: operational
  locations:
    - { page: 118, section: "G1 Entity-specific Cyber security - Impacts, risks, and opportunities" }
    - { page: 51, section: "Main risks" }
    - { page: 74, section: "G1 Business Conduct - Double materiality - Financial risks or opportunities" }
  description: >-
    Vestas’ digitally connected wind turbines, digital infrastructure, and other critical assets are exposed to
    constantly evolving cyber attacks by geopolitical actors and the cyber-criminal industry seeking extortion or to
    destabilise energy generation. A successful attack could disrupt operations, expose intellectual property, cause
    outages and physical damage for customers, and lead to significant financial loss, legal liability, and
    reputational damage.
  mitigation: >-
    Vestas manages cyber risks through its enterprise-wide Cyber Risk Management Strategy and has increased investment
    in cyber security across R&D, service, and digital infrastructure over the past three years. An internal Security
    Operations Centre and Cyber Academy training for every employee strengthen detection and response, while Vestas’
    cyber security services help customers manage their own cyber risks.

- title: Cyber security incidents
  category: cyber
  locations:
    - { page: 118, section: "G1 Entity-specific Cyber security - Impacts, risks, and opportunities" }
  description: >-
    A cyber security incident could disrupt Vestas’ ability to control power plants, directly impacting customers and,
    ultimately, society through power outages or higher electricity prices. The primary threat comes from politically
    or financially motivated actors seeking to trigger outages, and geopolitical tensions amplify the risk as Vestas
    is a potential target for those seeking to impact customers and power producers.
  mitigation: >-
    Vestas’ enterprise-wide Cyber Risk Management Strategy, launched in 2024, systematically identifies, assesses, and
    mitigates cyber risks. The Cyber Security Services Framework helps customers quantify and manage the impact of
    cyber incidents, and a customer-focused Security Operations Centre monitors serviced power plants to detect and
    respond to incidents. All Vestas technologies are built to the ISA/IEC 62443 cyber security standard.

- title: Carbon taxes and tariffs
  category: climate
  secondary: regulatory
  locations:
    - { page: 85, section: "E1 Climate Change - Impacts, risks, and opportunities" }
    - { page: 71, section: "E1 Climate Change - Financial materiality - Financial risks or opportunities" }
  description: >-
    Political and market transition risks such as high carbon taxes and tariffs will increase the cost of
    GHG-intensive materials like steel, raising the overall cost of wind turbines. If Vestas cannot pass these costs
    along the value chain or transition to low-carbon alternatives fast enough, its cost base may be impacted.
  mitigation: None

